version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: VehicleLookup.Api/Dockerfile
    image: vehicle-lookup-api:latest
    container_name: vehicle-api
    environment:
      ASPNETCORE_URLS: "http://+:8081"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # ConnectionStrings__DefaultConnection: "..."  # use .env or SSM later
    expose:
      - "8081"  # internal only
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: vehicle-lookup-ui/Dockerfile
    image: vehicle-lookup-web:latest
    container_name: vehicle-web
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./vehicle-lookup-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro  # certs from host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
