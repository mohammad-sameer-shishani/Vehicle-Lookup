<div class="dropdown">
  <button (click)="myFunction()" class="dropbtn">{{title()}}</button>
  <div id="myDropdown" class="rounded-2xl dropdown-content h-100 overflow-y-auto bg-white shadow-lg">
    <input class="text-primary relative text-sm" type="text" placeholder="Search.." id="myInput" (keyup)="filterFunction()">
    @for (make of makes; track $index) {
        <a href="#about">{{make.vehicleTypeId}}</a>
    }
  </div>
</div>
