<div class="from-primary to-secondary bg-gradient-to-r w-full p-2 ps-5 flex justify-between items-center">
    <div class="flex items-center gap-5 w-11/12">
        <div class="flex items-center gap-2 text-2xl font-bold">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-12">
                <path d="M3.375 4.5C2.339 4.5 1.5 5.34 1.5 6.375V13.5h12V6.375c0-1.036-.84-1.875-1.875-1.875h-8.25ZM13.5 15h-12v2.625c0 1.035.84 1.875 1.875 1.875h.375a3 3 0 1 1 6 0h3a.75.75 0 0 0 .75-.75V15Z" />
                <path d="M8.25 19.5a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0ZM15.75 6.75a.75.75 0 0 0-.75.75v11.25c0 .087.015.17.042.248a3 3 0 0 1 5.958.464c.853-.175 1.522-.935 1.464-1.883a18.659 18.659 0 0 0-3.732-10.104 1.837 1.837 0 0 0-1.47-.725H15.75Z" />
                <path d="M19.5 19.5a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0Z" />
            </svg>
            <a routerLink="/" class="max-h-16 border-r-white border-r-2 pr-6 ">Vehicle Lookup</a>
        </div>
        <a routerLink="/vehicles" routerLinkActive="text-accent">All Vehicles</a>
        <a routerLink="/makes" routerLinkActive="text-accent">Search by Make</a>
        <a routerLink="/vehicle-types" routerLinkActive="text-accent">Vehicle Types</a>
        <a routerLink="/aboutus" routerLinkActive="text-accent">About Us</a>
    </div>
    <div class="w-1/12 flex dropdown mr-5 dropdown-end">
        <button tabindex="1" 
        class="flex flex-col justify-center align-middle text-white cursor-pointer uppercase text-sm">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 flex self-center">
            <path fillRule="evenodd" d="M20.599 1.5c-.376 0-.743.111-1.055.32l-5.08 3.385a18.747 18.747 0 0 0-3.471 2.987 10.04 10.04 0 0 1 4.815 4.815 18.748 18.748 0 0 0 2.987-3.472l3.386-5.079A1.902 1.902 0 0 0 20.599 1.5Zm-8.3 14.025a18.76 18.76 0 0 0 1.896-1.207 8.026 8.026 0 0 0-4.513-4.513A18.75 18.75 0 0 0 8.475 11.7l-.278.5a5.26 5.26 0 0 1 3.601 3.602l.502-.278ZM6.75 13.5A3.75 3.75 0 0 0 3 17.25a1.5 1.5 0 0 1-1.601 1.497.75.75 0 0 0-.7 1.123 5.25 5.25 0 0 0 9.8-2.62 3.75 3.75 0 0 0-3.75-3.75Z" clipRule="evenodd" />
          </svg>
          <span>{{selecetedTheme()}}</span>
        </button>
        <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm overflow-y-auto">
          @for (theme of themes; track $index) {
            <li (click)="handleSelectTheme(theme)">
              <a>{{theme}}</a>
            </li>
          }
        </ul>
      </div>
</div>
