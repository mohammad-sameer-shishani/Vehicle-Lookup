# HTTP -> redirect to HTTPS (after certs are issued you can keep this)
server {
  listen 80;
  server_name _;

  location = /healthz { add_header Content-Type text/plain; return 200 'ok'; }
  location /.well-known/acme-challenge/ { root /usr/share/nginx/html; } # fallback

  return 301 https://$host$request_uri;
}

# HTTPS server
server {
  listen 443 ssl;
  server_name _;

  # ---- TLS certs (mounted from host) ----
  # Replace 'your-domain.com' with your actual domain when you request the cert
  ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

  # (Good defaults)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # ---- Static UI ----
  root /usr/share/nginx/html;
  index index.html;

  # Health for checks
  location = /healthz { add_header Content-Type text/plain; return 200 'ok'; }

  # Cache static assets (optional)
  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # ---- API proxy on /api ----
  location = /api { return 301 /api/; }

  # Trailing slash strips /api prefix: /api/foo -> /foo at upstream
  location /api/ {
    proxy_pass http://api:8081/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # SPA routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Basic security headers
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer-when-downgrade always;
}



